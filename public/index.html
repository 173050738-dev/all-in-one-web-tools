  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #FAF9F6; color: #2A3154; -webkit-font-smoothing: antialiased; }
    .wrap { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; gap: 24px; text-align: center; }
    .logo { font-weight: 700; font-size: 28px; letter-spacing: 0.02em; color: #2A3154; user-select: none; }
    .logo .accent { color: #5461A8; }
    .spinner { width: 40px; height: 40px; border-radius: 50%; border: 3px solid rgba(84,97,168,0.18); border-top-color: #5461A8; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tip { max-width: 420px; color: #4B5278; font-size: 14px; line-height: 1.6; }
    .btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 4px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 12px; font-size: 14px; font-weight: 500; text-decoration: none; transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease; touch-action: manipulation; }

    .langs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; max-width: 420px; width: 100%; }
    .langs .btn { min-height: 40px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
    @media (max-width: 480px) {
      .logo { font-size: 24px; }
      .langs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="wrap" role="main" aria-label="Language redirect">
    <div class="logo" aria-hidden="true">Kore<span class="accent">lyy</span></div>
    <div class="spinner" role="status" aria-label="Loading"></div>
    <p class="tip" id="tip">Detecting your language preference�?br/>若页面未自动跳转，请选择您的语言�?/p>
    <div class="langs" id="langs" role="group" aria-label="Choose language">
      <a class="btn btn-secondary" href="/en/" data-locale="en">English</a>
      <a class="btn btn-secondary" href="/zh/" data-locale="zh">简体中�?/a>
      <a class="btn btn-secondary" href="/es/" data-locale="es">Español</a>
      <a class="btn btn-secondary" href="/fr/" data-locale="fr">Français</a>
      <a class="btn btn-secondary" href="/hi/" data-locale="hi">हिन्दी</a>

    </div>
    <div class="btns">
      <a class="btn btn-primary" id="go" href="/en/">Continue �?/a>
    </div>
  </main>
  <script>
    (function () {
      'use strict';
      var SUPPORTED = ['en', 'zh', 'es', 'hi', 'fr', 'ar'];
      var DEFAULT_FOR_NON_ZH = 'en';
      var COOKIE_NAME = 'NEXT_LOCALE';

      function readCookie(name) {
        try {
          var parts = ('; ' + document.cookie).split('; ' + name + '=');
          if (parts.length >= 2) return decodeURIComponent(parts.pop().split(';').shift());
        } catch (e) { /* ignore */ }
        return '';
      }

      function writeCookie(name, value) {
        try {
          var maxAge = 60 * 60 * 24 * 365;
          document.cookie = name + '=' + encodeURIComponent(value) + '; path=/; SameSite=Lax; Max-Age=' + maxAge;
        } catch (e) { /* ignore */ }
      }

      function detectLocale() {
        var cookie = readCookie(COOKIE_NAME);
        if (cookie && SUPPORTED.indexOf(cookie) !== -1) return cookie;

        var nav = (navigator && (navigator.language || (navigator.languages && navigator.languages[0]))) || '';
        var tag = String(nav).toLowerCase();
        if (tag === 'zh' || tag.indexOf('zh-') === 0 || tag.indexOf('zh_') === 0) return 'zh';

        var short = tag.split(/[-_]/)[0];
        for (var i = 0; i < SUPPORTED.length; i++) {
          if (SUPPORTED[i] !== 'zh' && SUPPORTED[i] === short) return SUPPORTED[i];
        }
        return DEFAULT_FOR_NON_ZH;
      }

      var locale = detectLocale();
      var dest = '/' + locale + '/';
      dest += window.location.search + window.location.hash;

      var goBtn = document.getElementById('go');
      var tip = document.getElementById('tip');
      if (goBtn) goBtn.href = dest;

      var messages = {
        zh: '正在为您跳转到中文界面�?若未自动跳转，请手动选择�?,
        en: 'Redirecting to English interface�?If not redirected, please choose:',
        es: 'Redirigiendo a la interfaz en español�?Si no es redirigido, elija:',
        fr: 'Redirection vers l\\'interface française�?Si la redirection n\\'a pas lieu, choisissez :',
        hi: 'हिंदी इंटरफ़ेस पर रीडायरेक्ट किया जा रह�?है�?यद�?रीडायरेक्ट नही�?होता है, तो चुने�?',
        ar: 'جارٍ التوجيه إلى الواجهة العربية�?إذا لم يتم إعادة التوجيه، يرجى الاختيار:'
      };
      if (tip && messages[locale]) tip.textContent = messages[locale];

      setTimeout(function () {
        writeCookie(COOKIE_NAME, locale);
        window.location.replace(dest);
      }, 350);
    })();
  </script>
</body>
