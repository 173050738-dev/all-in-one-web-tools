<!DOCTYPE html>
<!--
  Google Search Console 域所有权 HTML 验证文件模板。
  ⚠️  使用前请按以下步骤操作：
    1. 登录 https://search.google.com/search-console → 添加/选择 korelyy.com 资源
    2. Settings → Ownership verification → 选择 "HTML file" 方式
    3. 下载 Google 给你的验证文件（文件名类似 google1234567890abcdef.html）
    4. 用下载的真实文件**直接替换**本模板文件（保持原文件名，不要沿用 googleXXXXXXXXXXXX.html）
       或直接把真实文件放到 public/ 目录下（两者二选一）
    5. 保存后重新构建部署（文件会出现在 https://korelyy.com/google1234567890abcdef.html ）

  💡 推荐优先用 meta google-site-verification 验证（不用改这个文件）：
       在 Cloudflare Pages Dashboard → 项目 Settings → Environment variables → Production
       添加变量 KORELYY_GOOGLE_VERIFY = <Google HTML Tag 中的 content 值>
       然后重新部署一次即可。
-->
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Google Search Console Verification - REPLACE THIS FILE</title>
</head>
<body>
<h1>Google Search Console Verification Placeholder</h1>
<p>This is a template file. Please replace it with the real verification HTML file downloaded from Google Search Console.</p>
<p>See comments in the HTML source for instructions.</p>
</body>
</html>
