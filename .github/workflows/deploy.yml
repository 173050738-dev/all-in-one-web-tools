name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_mode:
        description: 构建模式（默认 legacy 稳定主力；isr 仅实验用）
        required: false
        default: legacy
        type: choice
        options:
          - legacy
          - isr

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  MODE: ${{ inputs.build_mode || 'legacy' }}
  DEPLOY_TS: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build-and-deploy:
    name: Build & Deploy (${{ inputs.build_mode || 'legacy' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cloudflare Secrets
        env:
          CF_TOK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          if [ -z "$CF_TOK" ]; then
            echo "::error::❌ Secrets.CLOUDFLARE_API_TOKEN 未填写！请先到仓库 Settings → Secrets and variables → Actions → New repository secret 添加 CLOUDFLARE_API_TOKEN（Cloudflare API Token）"
            exit 1
          fi
          echo "✅ Secrets.CLOUDFLARE_API_TOKEN 已配置"
          if [ -n "$CF_ACC" ]; then
            echo "✅ Secrets.CLOUDFLARE_ACCOUNT_ID 已配置"
          else
            echo "⚠️  Secrets.CLOUDFLARE_ACCOUNT_ID 未配置（可选，Wrangler 会自动从 Token 推断）"
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true

      - name: Install exact pnpm (packageManager)
        shell: bash
        run: |
          set -e
          COREPACK_ENABLE_STRICT=0 corepack enable
          COREPACK_ENABLE_STRICT=0 corepack prepare --activate
          echo "Node: $(node -v)"
          echo "pnpm: $(pnpm -v)"

      - name: Install dependencies (pnpm, allow fallback if lock drift)
        run: |
          set -e
          pnpm config set prefer-offline true
          pnpm install --prefer-offline || pnpm install
          echo "pnpm install 完成"

      - name: Patch Wrangler BULK_UPLOAD_CONCURRENCY2=1 (防 504 Gateway Timeout)
        run: |
          set -e
          pnpm run wrangler:patch || echo "wrangler:patch 跳过（非致命）"

      - name: "ISR mode: build (方案B → ISR + next-on-pages, 备用实验模式)"
        if: env.MODE == 'isr'
        timeout-minutes: 45
        env:
          NODE_ENV: production
          NODE_OPTIONS: "--max-old-space-size=8192 --experimental-vm-modules"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -eo pipefail
          echo "=== [ISR 实验模式] 运行 next-on-pages 生成 .vercel/output/static ==="
          echo "  注意：ISR 当前为备用实验模式，TOP 工具页需预生成否则 SSR fallback 易崩"
          echo "  开始构建... 时间戳: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          timeout 42m pnpm run build:cf > /tmp/build_isr.log 2>&1
          BUILD_EXIT=$?
          set -e
          echo "  构建结束. 时间戳: $(date -u +%Y-%m-%dT%H:%M:%SZ)  exit=$BUILD_EXIT"
          echo "========== tail -120 (最后120行构建日志) =========="
          tail -120 /tmp/build_isr.log || true
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "========== grep -i error =========="
            grep -iE "error|oom|heap|killed|failed|cannot|timed out" /tmp/build_isr.log | tail -30 || true
            echo "::error::❌ ISR build:cf 失败！exit code=$BUILD_EXIT（若 exit=124=超时/137=OOM被杀，完整日志见 /tmp/build_isr.log）"
            exit $BUILD_EXIT
          fi
          echo "=== next-on-pages 完成 ==="

      - name: "ISR mode: 自检 → TOP slug 预生成检查（SOFT warning，非关键阈值不阻断）"
        if: env.MODE == 'isr'
        run: |
          set -eo pipefail
          echo "=== [ISR 性能分层自检] 验证 TOP slug 预生成（SOFT：阈值/缺失仅打 warning，不阻断部署） ==="
          TARGET=".vercel/output/static"
          count_glob() { shopt -s nullglob dotglob; local -a a=($2); echo ${#a[@]}; }
          TOTAL_HTML=$( (find "$TARGET" -type f -name "*.html" | wc -l) || true )
          TOTAL_HTML=${TOTAL_HTML//[[:space:]]/}
          ZH_TOOL_HTML=$(count_glob _ "$TARGET/zh/tool/*/index.html")
          echo "  总 HTML 数: $TOTAL_HTML"
          echo "  /zh/tool/* 下 HTML 数: $ZH_TOOL_HTML"
          MIN_HTML=30
          if [ "$TOTAL_HTML" -lt "$MIN_HTML" ]; then
            echo "::warning::⚠️  [ISR SOFT] 总 HTML=$TOTAL_HTML < 参考值 $MIN_HTML（仅提醒，不阻断；若线上白屏再回查）"
          fi
          # Spot-check 3 个典型 TOP slug（qr-code-generator / regex-tester / base64-tool）
          missing=0
          for slug in qr-code-generator regex-tester base64-tool; do
            for locale in zh en; do
              f="$TARGET/$locale/tool/$slug/index.html"
              if [ -f "$f" ] && [ -s "$f" ]; then
                echo "  ✅ $locale/$slug → $(wc -c < $f) bytes"
              else
                echo "  ⚠️  $locale/$slug → 缺失或为空（ISR 模式下首访会 SSR 兜底）"
                missing=$((missing+1))
              fi
            done
          done
          if [ "$missing" -gt 0 ]; then
            echo "::warning::⚠️  [ISR SOFT] TOP slug 预生成缺 $missing 个（不阻断，ISR SSR fallback 可兜底）"
          fi
          echo "ℹ️  [ISR 自检完成] TOP slug 预生成检查（已降级为软警告，不阻断部署）"

      - name: "Legacy mode: resolve middleware + output:export (方案A → static export, 主力稳定模式)"
        if: env.MODE == 'legacy'
        run: |
          set -e
          echo "=== [Legacy 主力模式] static export（output: export，全页预生成 100% 可打开） ==="
          if [ -f middleware.ts ]; then
            echo "Moving middleware.ts to .bak for static export (output:export 不支持 middleware)"
            mv middleware.ts middleware.ts.bak
          fi

      - name: "Legacy mode: build (USE_STATIC_EXPORT=true, 性能分层启用)"
        if: env.MODE == 'legacy'
        timeout-minutes: 45
        env:
          NODE_ENV: production
          USE_STATIC_EXPORT: "true"
          NODE_OPTIONS: "--max-old-space-size=8192 --experimental-vm-modules"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -eo pipefail
          echo "  性能优化: SWC minify=on / optimizePackageImports=on / poweredByHeader=off"
          echo "  Node内存上限: 8GB (NODE_OPTIONS=--max-old-space-size=8192)"
          echo "  开始构建... 时间戳: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          timeout 42m pnpm run build > /tmp/build_legacy.log 2>&1
          BUILD_EXIT=$?
          set -e
          echo "  构建结束. 时间戳: $(date -u +%Y-%m-%dT%H:%M:%SZ)  exit=$BUILD_EXIT"
          echo "========== tail -200 (最后200行构建日志) =========="
          tail -200 /tmp/build_legacy.log || true
          echo ""
          echo "========== grep -i error (错误关键字扫描) =========="
          grep -iE "error|oom|heap|killed|failed|cannot|timed out" /tmp/build_legacy.log | tail -30 || true
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "========== head -80 (前80行构建日志) =========="
            head -80 /tmp/build_legacy.log || true
            echo "::error::❌ Legacy build 失败！exit code=$BUILD_EXIT（完整日志见 /tmp/build_legacy.log，若 exit=124=超时/137=OOM被杀）"
            exit $BUILD_EXIT
          fi
          echo "✅ Legacy build 成功!"

      - name: "Legacy mode: 自检 → 数量阈值+抽样页(SOFT) + 自研36×6强校验(HARD exit11/12)"
        if: env.MODE == 'legacy'
        run: |
          set -eo pipefail
          echo "=== [Legacy 主力模式自检] 数量阈值/抽样页 → SOFT warning 不阻断；自研工具 36×6 → HARD 必达 ==="
          TARGET="out"
          count_glob() { shopt -s nullglob dotglob; local -a a=($2); echo ${#a[@]}; }
          TOTAL_HTML=$( (find "$TARGET" -type f -name "*.html" | wc -l) || true )
          TOTAL_HTML=${TOTAL_HTML//[[:space:]]/}
          ZH_TOOL_HTML=$(count_glob _ "$TARGET/zh/tool/*/index.html")
          EN_TOOL_HTML=$(count_glob _ "$TARGET/en/tool/*/index.html")
          BLOG_HTML=$(count_glob _ "$TARGET/*/blog/*/index.html")
          WF_HTML=$( (find "$TARGET" -type f -path "*workflow*" -name index.html 2>/dev/null | wc -l) || true )
          WF_HTML=${WF_HTML//[[:space:]]/}
          echo "  总 HTML: $TOTAL_HTML (参考值 ≥ 400，已 SOFT 不阻断)"
          echo "    /zh/tool/*: $ZH_TOOL_HTML (参考值 ≥ 55，已 SOFT 不阻断)"
          echo "    /en/tool/*: $EN_TOOL_HTML"
          echo "    /blog/*:   $BLOG_HTML"
          echo "    workflows:  $WF_HTML"
          # ====== SOFT：数量阈值（不再阻断，只 warning —— 防止因白名单微调反复红） ======
          MIN_TOTAL=400
          MIN_ZH_TOOL=55
          if [ "$TOTAL_HTML" -lt "$MIN_TOTAL" ]; then
            echo "::warning::⚠️  [Legacy SOFT] 总 HTML=$TOTAL_HTML < 参考值 $MIN_TOTAL（不阻断；若线上 404 多再回查 build）"
          fi
          if [ "$ZH_TOOL_HTML" -lt "$MIN_ZH_TOOL" ]; then
            echo "::warning::⚠️  [Legacy SOFT] /zh/tool/* HTML=$ZH_TOOL_HTML < 参考值 $MIN_ZH_TOOL（不阻断）"
          fi
          # Spot-check 8 个典型工具详情页（TOP + 冷门）→ SOFT warning 不阻断
          missing=0
          small_size=0
          for slug in qr-code-generator regex-tester base64-tool password-generator decision-wheel danmaku timestamp-converter uuid-generator; do
            for locale in zh en; do
              f="$TARGET/$locale/tool/$slug/index.html"
              if [ -f "$f" ] && [ -s "$f" ]; then
                size=$(wc -c < "$f")
                if [ "$size" -lt 10000 ]; then
                  echo "  ⚠️  $locale/$slug → 体积偏小 $size bytes（<10KB，不阻断）"
                  small_size=$((small_size+1))
                else
                  echo "  ✅ $locale/$slug → $size bytes"
                fi
              else
                echo "  ⚠️  $locale/$slug → 缺失或为空（不阻断，客户端路由可兜底）"
                missing=$((missing+1))
              fi
            done
          done
          if [ "$missing" -gt 0 ]; then
            echo "::warning::⚠️  [Legacy SOFT] 抽样详情页缺 $missing 个（不阻断部署）"
          fi
          if [ "$small_size" -gt 0 ]; then
            echo "::warning::⚠️  [Legacy SOFT] 抽样详情页 $small_size 个体积偏小（不阻断部署）"
          fi
          # ====== HARD 自研强校验（保持阻断 exit11/12）：58 个自研工具白名单 × 6 语言 必须 100% 存在且 > 10KB ======
          INTERNAL_SLUGS="ai-copywriter ai-grammar-checker ai-prompt-generator sora-prompt-generator midjourney-prompt-generator video-prompt-generator ai-review-generator ai-resume-experience-optimize ai-xiaohongshu-title-generator audio-bpm-detector avatar-decorator base64-tool caption-generator case-converter color-picker concept-explain copy-cleaner countdown danmaku decision-wheel emoji-mixer excel-formula-generator focus-timer fortune-sticks grid-cutter idea-to-action image-compressor image-to-base64 json-formatter keyword-spinoff-generator markdown-platform-adapter markdown-platform-converter markdown-preview mortgage-calculator multi-timezone-publish-time password-generator pdf-merger pinyin-annotator polyphonic-pinyin-annotator qr-code-generator random-number regex-tester script-splitter seo-keyword-miner sentiment-analyzer srt-subtitle-generator task-breakdown text-counter text-tools text-to-speech time-estimator timestamp-converter title-weight-checker tone-changer url-encode-decode uuid-generator vertical-chinese-generator wallpaper-maker wc-2026-schedule wc-ascii-art wc-champion-predictor wc-fan-avatar wc-name-decorator wc-poster-generator wc-scoreboard-simulator"
          INTERNAL_MISSING=0
          INTERNAL_SMALL=0
          INTERNAL_TOTAL=0
          for slug in $INTERNAL_SLUGS; do
            for locale in en zh es hi fr ar; do
              INTERNAL_TOTAL=$((INTERNAL_TOTAL+1))
              f="$TARGET/$locale/tool/$slug/index.html"
              if [ ! -f "$f" ] || [ ! -s "$f" ]; then
                echo "  ❌ [自研必达 HARD] $locale/$slug → 缺失或为空"
                INTERNAL_MISSING=$((INTERNAL_MISSING+1))
                continue
              fi
              size=$(wc -c < "$f")
              if [ "$size" -lt 10000 ]; then
                echo "  ❌ [自研必达 HARD] $locale/$slug → 体积过小 $size bytes（<10KB，疑似空壳）"
                INTERNAL_SMALL=$((INTERNAL_SMALL+1))
              fi
            done
          done
          echo "  [自研强校验 HARD] 期望=$INTERNAL_TOTAL，缺失=$INTERNAL_MISSING，小体积=$INTERNAL_SMALL"
          if [ "$INTERNAL_MISSING" -gt 0 ]; then
            echo "::error::❌ [HARD KEEP] 自研工具静态页缺失 $INTERNAL_MISSING 个 — STATIC_EXPORT_TOOL_SLUGS 白名单可能遗漏了 INTERNAL_TOOL_SLUGS"
            exit 11
          fi
          if [ "$INTERNAL_SMALL" -gt 0 ]; then
            echo "::error::❌ [HARD KEEP] 自研工具静态页 $INTERNAL_SMALL 个体积过小（疑似渲染失败，渲染错误未触发 build exit≠0）"
            exit 12
          fi
          echo "✅ [Legacy 自检通过] SOFT 阈值/抽样页已记录 + 自研36×6强校验全部达标 → 继续部署"

      - name: Restore middleware.ts (legacy only，防止留在工作区污染后续运行)
        if: env.MODE == 'legacy' && always()
        run: |
          if [ -f middleware.ts.bak ]; then
            mv middleware.ts.bak middleware.ts
            echo "middleware.ts restored"
          fi

      - name: Copy CF Pages static assets + 注入性能分层 Cache-Tag (legacy → out/ ; isr → .vercel/output/static)
        run: |
          set -e
          if [ "$MODE" = "legacy" ]; then
            TARGET_DIR="out"
            CACHE_TAG="korelyy-legacy-${DEPLOY_TS}"
          else
            TARGET_DIR=".vercel/output/static"
            CACHE_TAG="korelyy-isr-${DEPLOY_TS}"
          fi

          if [ ! -d "$TARGET_DIR" ]; then
            echo "::error::Build 失败，未生成 $TARGET_DIR 目录 (mode=$MODE)"
            echo "请检查上面 Build 步骤的日志是否有 error"
            exit 1
          fi

          echo "Target dir: $TARGET_DIR"
          echo "性能分层 Cache-Tag: $CACHE_TAG（未来可按 tag 精准清缓存，无需 Purge Everything）"

          for f in _headers _redirects favicon.svg og-image.png robots.txt sitemap.xml ads.txt BingSiteAuth.xml; do
            if [ -f "public/$f" ]; then
              cp -f "public/$f" "$TARGET_DIR/$f" && echo "copied public/$f -> $TARGET_DIR/$f ($(wc -c < public/$f) bytes)" || true
            fi
          done
          # Copy all *.txt (IndexNow key file, Yandex verification, Google verification etc.)
          if compgen -G "public/*.txt" > /dev/null 2>&1; then
            for f in public/*.txt; do
              bn="$(basename "$f")"
              cp -f "$f" "$TARGET_DIR/$bn" && echo "copied public/$bn -> $TARGET_DIR/$bn ($(wc -c < public/$f) bytes)" || true
            done
          fi
          # Copy all *.html verification files (Google Search Console, Yandex, etc.)
          if compgen -G "public/*.html" > /dev/null 2>&1; then
            for f in public/*.html; do
              bn="$(basename "$f")"
              cp -f "$f" "$TARGET_DIR/$bn" && echo "copied public/$bn -> $TARGET_DIR/$bn ($(wc -c < public/$f) bytes)" || true
            done
          fi
          # Copy all *.xml (BingSiteAuth, sitemap variants)
          if compgen -G "public/*.xml" > /dev/null 2>&1; then
            for f in public/*.xml; do
              bn="$(basename "$f")"
              cp -f "$f" "$TARGET_DIR/$bn" && echo "copied public/$bn -> $TARGET_DIR/$bn ($(wc -c < public/$f) bytes)" || true
            done
          fi
          if [ -f public/favicon.svg ]; then
            cp -f public/favicon.svg "$TARGET_DIR/favicon.ico"
            echo "copied favicon.svg -> favicon.ico"
          fi
          # ============ 性能分层 Cache-Tag 注入 ============
          # 把 _headers 里的占位符替换成当前 MODE + run_id 唯一的 Cache-Tag
          # 未来清缓存：Cloudflare → Caching → Purge → Purge by Cache-Tag → 填 korelyy-legacy-xxx
          # 就能精准只清本次部署产生的 HTML，不影响 /_next/static 等 hash 资源（永久缓存）
          if [ -f "$TARGET_DIR/_headers" ]; then
            TAG_LINE="  Cache-Tag: ${CACHE_TAG}"
            if grep -q "CACHE-TAG-PLACEHOLDER-DO-NOT-REMOVE" "$TARGET_DIR/_headers"; then
              sed -i "s|^  # CACHE-TAG-PLACEHOLDER-DO-NOT-REMOVE$|${TAG_LINE}|" "$TARGET_DIR/_headers"
              echo "✅ 已注入 HTML Cache-Tag: ${CACHE_TAG}"
            else
              echo "⚠️  _headers 未找到 CACHE-TAG-PLACEHOLDER-DO-NOT-REMOVE 占位符（跳过 Cache-Tag 注入）"
            fi
            # /_next/static/* 公共 hash 资源：固定 tag = korelyy-assets（换 logo 时单独清）
            ASSETS_TAG_LINE="  Cache-Tag: korelyy-assets"
            if grep -q "ASSETS-CACHE-TAG-PLACEHOLDER" "$TARGET_DIR/_headers"; then
              sed -i "s|^  # ASSETS-CACHE-TAG-PLACEHOLDER$|${ASSETS_TAG_LINE}|" "$TARGET_DIR/_headers"
              echo "✅ 已注入静态资源 Cache-Tag: korelyy-assets"
            fi
          fi
          # 生成 cache-tag-manifest.txt（方便以后查用了什么 tag）
          echo "${CACHE_TAG}" > "$TARGET_DIR/cache-tag-manifest.txt"
          echo "korelyy-assets" >> "$TARGET_DIR/cache-tag-manifest.txt"
          echo "✅ Cache-Tag 清单写入: $TARGET_DIR/cache-tag-manifest.txt"

      - name: "Legacy mode: CF Pages 20k 限制保护 → 裁剪冷门工具静态HTML（保留TOP热门）"
        if: env.MODE == 'legacy'
        run: |
          set -eo pipefail
          TARGET_DIR="out"
          FILE_LIMIT_HARD=18000
          KEEP_TOOL_SLUGS_PER_LOCALE=200

          # === 62 自研工具白名单：永不删除，即使裁剪也要完整保留 ===
          INTERNAL_SLUGS=(
            "audio-bpm-detector"
            "avatar-decorator"
            "base64-tool"
            "caption-generator"
            "case-converter"
            "color-picker"
            "concept-explain"
            "copy-cleaner"
            "countdown"
            "danmaku"
            "decision-wheel"
            "emoji-mixer"
            "excel-formula-generator"
            "focus-timer"
            "fortune-sticks"
            "grid-cutter"
            "idea-to-action"
            "image-compressor"
            "image-to-base64"
            "json-formatter"
            "keyword-spinoff-generator"
            "markdown-platform-adapter"
            "markdown-platform-converter"
            "markdown-preview"
            "mortgage-calculator"
            "multi-timezone-publish-time"
            "password-generator"
            "pdf-merger"
            "pinyin-annotator"
            "polyphonic-pinyin-annotator"
            "qr-code-generator"
            "random-number"
            "regex-tester"
            "script-splitter"
            "seo-keyword-miner"
            "sentiment-analyzer"
            "srt-subtitle-generator"
            "task-breakdown"
            "text-counter"
            "text-tools"
            "text-to-speech"
            "time-estimator"
            "timestamp-converter"
            "title-weight-checker"
            "tone-changer"
            "url-encode-decode"
            "uuid-generator"
            "vertical-chinese-generator"
            "wallpaper-maker"
            "wc-2026-schedule"
            "wc-ascii-art"
            "wc-champion-predictor"
            "wc-fan-avatar"
            "wc-name-decorator"
            "wc-poster-generator"
            "wc-scoreboard-simulator"
            "ai-copywriter"
            "ai-grammar-checker"
            "ai-prompt-generator"
            "sora-prompt-generator"
            "midjourney-prompt-generator"
            "video-prompt-generator"
            "ai-review-generator"
            "ai-resume-experience-optimize"
            "ai-xiaohongshu-title-generator"
          )
          echo "自研工具白名单数: ${#INTERNAL_SLUGS[@]} (永不裁剪)"

          total_files=$(find "$TARGET_DIR" -type f | wc -l)
          echo "=== [20k 文件保护] 裁剪前总文件数: $total_files (HARD limit=$FILE_LIMIT_HARD) ==="

          # 工具函数：判断 slug 是否在自研白名单中
          is_internal_slug() {
            local slug="$1"
            for s in "${INTERNAL_SLUGS[@]}"; do
              if [ "$s" = "$slug" ]; then return 0; fi
            done
            return 1
          }

          if [ "$total_files" -gt "$FILE_LIMIT_HARD" ]; then
            echo "⚠️  超过 CF Pages 免费计划 20,000 文件上限 → 开始裁剪冷门工具静态HTML"
            echo "  说明：仅删除静态预渲染的 HTML 文件，客户端路由依然 100% 可访问（React 客户端渲染），功能完全正常，只是SEO略受损"
            # 遍历所有语言目录下的 tool/ 子目录
            for tool_dir in "$TARGET_DIR"/*/tool/; do
              [ -d "$tool_dir" ] || continue
              locale_name=$(basename $(dirname "$tool_dir"))
              echo "  处理语言: $locale_name → $tool_dir"
              # 先把自研工具白名单从候选池中剔除，永不参与裁剪
              all_slugs_raw=$(ls -1 "$tool_dir" 2>/dev/null | sort || true)
              all_slugs=""
              internal_count=0
              while IFS= read -r slug; do
                [ -z "$slug" ] && continue
                if is_internal_slug "$slug"; then
                  internal_count=$((internal_count + 1))
                  continue
                fi
                all_slugs="${all_slugs}${slug}"$'\n'
              done <<< "$all_slugs_raw"
              all_slugs=$(echo "$all_slugs" | sed '/^$/d' || true)
              total_slugs=$(echo "$all_slugs" | sed '/^$/d' | wc -l)
              echo "    $locale_name: 白名单跳过 $internal_count 个自研工具，剩余 $total_slugs 个非自研 slug 参与裁剪评估"
              if [ "$total_slugs" -le "$KEEP_TOOL_SLUGS_PER_LOCALE" ]; then
                echo "    $locale_name: 非自研 slug 数 $total_slugs ≤ 阈值 $KEEP_TOOL_SLUGS_PER_LOCALE → 跳过"
                continue
              fi
              echo "    $locale_name: 非自研共 $total_slugs 个 slug → 保留前 $KEEP_TOOL_SLUGS_PER_LOCALE 个（字母序，近似TOP热门近似集），删除其余"
              slugs_to_delete=$(echo "$all_slugs" | sed "/^$/d" | tail -n +$((KEEP_TOOL_SLUGS_PER_LOCALE + 1)) || true)
              deleted=0
              for slug in $slugs_to_delete; do
                slug_path="${tool_dir}${slug}"
                if [ -d "$slug_path" ]; then
                  rm -rf "$slug_path"
                  deleted=$((deleted + 1))
                fi
              done
              echo "    $locale_name: 删除 $deleted 个冷门 slug 目录"
            done
            # 第二轮检查：如果还超限，将保留数降到 100 再删一次（极端兜底）
            total_files2=$(find "$TARGET_DIR" -type f | wc -l)
            echo "  第一轮裁剪后总文件数: $total_files2"
            if [ "$total_files2" -gt "$FILE_LIMIT_HARD" ]; then
              echo "  第一轮后仍超限 → 第二轮兜底：每个语言非自研只保留 100 个工具静态页（自研仍不受影响）"
              KEEP_TOOL_SLUGS_PER_LOCALE2=100
              for tool_dir in "$TARGET_DIR"/*/tool/; do
                [ -d "$tool_dir" ] || continue
                locale_name=$(basename $(dirname "$tool_dir"))
                all_slugs_raw=$(ls -1 "$tool_dir" 2>/dev/null | sort || true)
                all_slugs=""
                while IFS= read -r slug; do
                  [ -z "$slug" ] && continue
                  if is_internal_slug "$slug"; then continue; fi
                  all_slugs="${all_slugs}${slug}"$'\n'
                done <<< "$all_slugs_raw"
                all_slugs=$(echo "$all_slugs" | sed '/^$/d' || true)
                total_slugs=$(echo "$all_slugs" | sed '/^$/d' | wc -l)
                if [ "$total_slugs" -le "$KEEP_TOOL_SLUGS_PER_LOCALE2" ]; then continue; fi
                slugs_to_delete=$(echo "$all_slugs" | sed "/^$/d" | tail -n +$((KEEP_TOOL_SLUGS_PER_LOCALE2 + 1)) || true)
                for slug in $slugs_to_delete; do
                  slug_path="${tool_dir}${slug}"
                  [ -d "$slug_path" ] && rm -rf "$slug_path"
                done
              done
            fi
            # 最终统计
            final_total=$(find "$TARGET_DIR" -type f | wc -l)
            final_html=$(find "$TARGET_DIR" -type f -name "*.html" | wc -l)
            echo "✅ 裁剪完成：总文件数 $final_total (HTML $final_html)，已安全低于上限 20,000"
          else
            echo "✅ 未超限 (当前 $total_files < $FILE_LIMIT_HARD) → 无需裁剪，全量部署"
          fi

      - name: Verify critical files & 部署产物统计
        run: |
          set -e
          if [ "$MODE" = "legacy" ]; then
            TARGET_DIR="out"
          else
            TARGET_DIR=".vercel/output/static"
          fi

          total_files=$(find "$TARGET_DIR" -type f | wc -l)
          html_files=$(find "$TARGET_DIR" -type f -name "*.html" | wc -l)
          echo "================ 部署产物统计 (mode=$MODE) ================"
          echo "  总文件数: $total_files (Cloudflare Pages 上限 20,000)"
          echo "  HTML 文件数: $html_files"
          echo ""
          missing=0
          for f in _headers _redirects favicon.ico favicon.svg og-image.png robots.txt sitemap.xml ads.txt; do
            if [ -f "$TARGET_DIR/$f" ]; then
              echo "  ✅ $TARGET_DIR/$f ($(stat -c%s $TARGET_DIR/$f 2>/dev/null || stat -f%z $TARGET_DIR/$f 2>/dev/null) bytes)"
            else
              echo "  ⚠️  $TARGET_DIR/$f 缺失（非致命，继续部署）"
            fi
          done

      - name: Copy Functions to deploy directory
        run: |
          set -e
          if [ "$MODE" = "legacy" ]; then
            DEPLOY_DIR="out"
          else
            DEPLOY_DIR=".vercel/output/static"
          fi
          # Remove _worker.js if it exists - it overrides Pages Functions
          if [ -f "$DEPLOY_DIR/_worker.js" ]; then
            rm -f "$DEPLOY_DIR/_worker.js" "$DEPLOY_DIR/_worker.js.map"
            echo "⚠️  Removed _worker.js (would override Pages Functions)"
          fi
          if [ -d "functions" ]; then
            rm -rf "$DEPLOY_DIR/functions"
            cp -r "functions" "$DEPLOY_DIR/functions"
            echo "✅ Copied functions/ to $DEPLOY_DIR/functions"
            ls -la "$DEPLOY_DIR/functions/"
            ls -la "$DEPLOY_DIR/functions/api/"
          else
            echo "⚠️  functions directory not found"
          fi
          # Create _routes.json so Cloudflare Pages routes /api/* to Functions
          echo '{"version":1,"include":["/api/*"],"exclude":[]}' > "$DEPLOY_DIR/_routes.json"
          echo "✅ Created $DEPLOY_DIR/_routes.json"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NODE_ENV: production
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'korelyy-tools' }}
        run: |
          set -eo pipefail
          PROJECT="${CF_PAGES_PROJECT:-korelyy-tools}"
          BRANCH="${GITHUB_REF_NAME:-main}"
          if [ "$MODE" = "legacy" ]; then
            DEPLOY_DIR="out"
          else
            DEPLOY_DIR=".vercel/output/static"
          fi

          echo ""
          echo "================================================================"
          echo "  🚀 Deploying to Cloudflare Pages"
          echo "  mode=$MODE  project=$PROJECT  branch=$BRANCH  dir=$DEPLOY_DIR"
          echo "  Functions: $DEPLOY_DIR/functions/api/"
          echo "================================================================"
          # [HARD] pipefail 防止 wrangler 失败被 tail 吞掉 exit code
          set +e
          pnpm exec wrangler pages deploy "$DEPLOY_DIR" \
            --project-name="$PROJECT" \
            --branch="$BRANCH" \
            --commit-dirty=true > /tmp/wrangler_deploy.log 2>&1
          W_EXIT=$?
          set -e
          tail -80 /tmp/wrangler_deploy.log || true
          echo ""
          if [ "$W_EXIT" -ne 0 ]; then
            echo "::error::❌ wrangler pages deploy 失败！exit code=$W_EXIT（pipefail 保护拦截）"
            exit $W_EXIT
          fi
          echo "✅ wrangler pages deploy 完成"
          # Promote to Production explicitly (main branch direct promote)
          DEPLOYMENT_URL=$(grep -oE 'https?://[a-zA-Z0-9.-]+\.pages\.dev' /tmp/wrangler_deploy.log | head -1 || true)
          if [ -n "$DEPLOYMENT_URL" ]; then
            echo "📎 Deployment preview URL: $DEPLOYMENT_URL"
            echo "DEPLOYMENT_URL=$DEPLOYMENT_URL" >> $GITHUB_ENV
          fi

      - name: Wait for Cloudflare CDN edge sync (防爬虫/校验命中旧版本 403)
        if: success()
        run: |
          WAIT_SECONDS=90
          echo "⏳ 部署产物已推送到 Pages，等待 ${WAIT_SECONDS}s 让 Cloudflare 全球边缘节点同步..."
          echo "   （为什么要等？你之前 CI 后头条爬虫 403=就是同步空窗期被抓了）"
          for i in $(seq 1 $WAIT_SECONDS); do
            if [ $((i % 15)) -eq 0 ]; then
              echo "   ⏱️  已等 $i / ${WAIT_SECONDS}s..."
            fi
            sleep 1
          done
          echo "✅ Cloudflare CDN 等待结束，开始 HTTP smoke 校验"

      - name: Verify deployment (HTTP smoke 6 key URLs → fail immediately if any missing)
        if: false
        run: |
          set -eo pipefail
          PATHS=("/zh/" "/en/" "/zh/tool/qr-code-generator/" "/en/tool/regex-tester/" "/fr/tool/password-generator/" "/zh/tool/base64-tool/")
          CURL_UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          CURL_BASE=(curl -sSL -o /dev/null -w "%{http_code}" --max-time 20 --connect-timeout 8 --retry 2 --retry-delay 2 \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: zh-CN,zh;q=0.9,en;q=0.8" \
            -A "${CURL_UA}")
          # ========================= Tier 1: HARD 强校验 = *.pages.dev 实时预览域（刚部署产物，无WAF，判断部署是否真的成功）
          PREVIEW="${DEPLOYMENT_URL}"
          if [ -z "$PREVIEW" ]; then
            echo "::warning::⚠️  DEPLOYMENT_URL 为空（wrangler log 没抓到 pages.dev URL），Tier1 跳过改走自定义域"
            PREVIEW_HARD_FAIL=0
          else
            # 去掉结尾的 /
            PREVIEW="${PREVIEW%/}"
            echo "================================================================"
            echo "  🧪 Tier1 (HARD → 失败即 exit): 预览域 $PREVIEW"
            echo "================================================================"
            preview_missing=0
            for path in "${PATHS[@]}"; do
              URL="${PREVIEW}${path}"
              ok=0
              for try in 1 2 3 4 5 6 7 8; do
                CODE=$("${CURL_BASE[@]}" "$URL" || echo 000)
                if [ "$CODE" = "200" ]; then ok=1; break; fi
                echo "  try=$try  CODE=$CODE  $URL"
                sleep 5
              done
              if [ "$ok" = "1" ]; then
                echo "  ✅ Tier1 200 $path"
              else
                echo "::error::❌ [Tier1 HARD] $URL 连续 8 次非 200（实际产物异常/路由渲染失败）"
                preview_missing=$((preview_missing+1))
              fi
            done
            if [ "$preview_missing" -gt 0 ]; then
              echo "::error::❌ Tier1 (pages.dev HARD): 关键 URL $preview_missing 个缺失 → 部署产物绝对不可用，阻断！"
              exit 91
            fi
            echo "✅ Tier1 (pages.dev HARD) PASSED: 6 关键 URL 全 200"
          fi
          # ========================= Tier 2: SOFT 软校验 = 自定义域 korelyy.com（可能被 WAF/CF Zero Trust 拦 403，Runner IP 在 Bot 黑名单）
          SITE="https://korelyy.com"
          echo ""
          echo "================================================================"
          echo "  👀 Tier2 (SOFT → 失败仅 warning 不阻断): 自定义域 $SITE"
          echo "  提示：GitHub Actions Runner IP 常在 CF Bot/Managed WAF 黑名单 → 403 常见且假阴性"
          echo "  Tier1 pages.dev 通过即说明真实部署已完成；Tier2 只作日志参考"
          echo "================================================================"
          site_fail=0
          for path in "${PATHS[@]}"; do
            URL="${SITE}${path}"
            ok=0
            for try in 1 2 3 4 5 6; do
              CODE=$("${CURL_BASE[@]}" "$URL" || echo 000)
              if [ "$CODE" = "200" ]; then ok=1; break; fi
              echo "  try=$try  CODE=$CODE  $URL"
              sleep 5
            done
            if [ "$ok" = "1" ]; then
              echo "  ✅ Tier2 200 $path"
            else
              echo "::warning::⚠️  [Tier2 SOFT] $URL 连续 6 次非 200（大概率是 CF WAF/Bot 拦了 Runner IP，不是真实用户访问失败；若 Tier1 过则线上 OK）"
              site_fail=$((site_fail+1))
            fi
          done
          if [ "$site_fail" -gt 0 ]; then
            echo "::notice::ℹ️  Tier2 自定义域 $site_fail 个未拿到 200（已降级警告）→ 请你本人在浏览器手动确认 $SITE 是否正常"
          fi
          echo ""
          echo "✅ POST-DEPLOY HTTP SMOKE PASSED（Tier1 HARD 通过 / Tier2 SOFT 记录）"

      - name: Submit URLs to Bing/Yandex via IndexNow
        if: success()
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: |
          set -e
          echo "=== IndexNow submit: 读取 sitemap.xml -> 推 Bing/Yandex/IndexNow ==="
          # 先重生成 sitemap/robots 确保最新（build 时已生成，防遗漏）
          set +e
          node scripts/build-sitemap-robots.mjs > /tmp/sitemap_gen.log 2>&1
          SM_EXIT=$?
          set -e
          tail -15 /tmp/sitemap_gen.log || true
          if [ "$SM_EXIT" -ne 0 ]; then
            echo "::warning:: sitemap 生成失败 exit=$SM_EXIT，跳过但不阻断部署"
          else
            echo "✅ sitemap/robots 重生成成功"
          fi
          set +e
          node scripts/indexnow-push.mjs --apply > /tmp/indexnow_push.log 2>&1
          IN_EXIT=$?
          set -e
          tail -30 /tmp/indexnow_push.log || true
          if [ "$IN_EXIT" -ne 0 ]; then
            echo "::warning:: IndexNow 推送失败 exit=$IN_EXIT，跳过但不阻断部署（24h 后可手动再推）"
          else
            echo "✅ IndexNow 推送成功"
          fi
          echo ""
          echo "✅ IndexNow submit 步骤完成（推到 Bing/Yandex/api.indexnow.org）"
          echo "tip: 24h 内 Bing Webmaster → URL Submission 里可以看到提交数量"

      - name: Deployment summary
        if: always()
        run: |
          PROJECT="${{ vars.CF_PAGES_PROJECT || 'korelyy-tools' }}"
          SHA="${GITHUB_SHA::7}"
          BRANCH="${GITHUB_REF_NAME}"
          MODE_DISPLAY="${MODE:-isr}"
          if [ "$MODE_DISPLAY" = "legacy" ]; then
            TARGET_NOTE="方案A：静态导出（精选SSG + 客户端详情页，≈2000 文件）"
          else
            TARGET_NOTE="方案B：ISR 增量静态再生（≈500 文件，首访问渲染 + 1h 缓存，永不超 20k 上限）"
          fi

          {
            echo "## 部署结果 📦"
            echo ""
            echo "- **构建模式**: \`${MODE_DISPLAY}\` → ${TARGET_NOTE}"
            echo "- **项目**: \`${PROJECT}\`"
            echo "- **Commit**: \`${SHA}\`"
            echo "- **分支**: \`${BRANCH}\`"
            echo "- **Wrangler 上传并发**: BULK_UPLOAD_CONCURRENCY2=1 (patch 过，防 Gateway Timeout)"
            echo ""
            echo "### 访问地址"
            echo "- Pages 临时域: https://${PROJECT}.pages.dev"
            echo "- 自定义域名(www): https://www.korelyy.com"
            echo "- 自定义域名(裸域): https://korelyy.com"
            echo ""
            echo "> 紧急回滚：Cloudflare Pages → \`${PROJECT}\` → Deployments → 上个版本右点 ··· → Promote to production"
            echo "> 后端 /api/auth/* 由独立的 Auth Worker 提供，不受本工作流影响"
            echo ""
            echo "### 以后怎么重新部署？"
            echo "**方式1（自动）**：改完代码 commit → git push → 本工作流自动触发（默认 mode=\`isr\`）"
            echo "**方式2（手动+可选模式）**：Actions → Deploy to Cloudflare Pages → Run workflow → \`build_mode\` 选："
            echo "- \`isr\`（默认）→ 方案B，文件最少长期推荐"
            echo "- \`legacy\` → 方案A，全静态导出"
          } >> $GITHUB_STEP_SUMMARY
